name: Sync Remote Server with MCP Registry

on:
  push:
    branches:
      - main
    paths:
      - "server.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish Remote SSE Entry
        uses: modelcontextprotocol/registry-action@v1
        with:
          manifest: "server.json"
