name: Sync Remote Server with MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MCP Publisher CLI
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz
          sudo mv mcp-publisher /usr/local/bin/
          sudo chmod +x /usr/local/bin/mcp-publisher

      - name: Authenticate and Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
