name: Sync Remote Server with MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MCP Publisher CLI
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher-linux-amd64 -o /usr/local/bin/mcp-publisher || true
          chmod +x /usr/local/bin/mcp-publisher || true

      - name: Authenticate and Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
