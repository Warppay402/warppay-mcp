name: Sync Remote Server with MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login and Publish to MCP Registry
        run: |
          npx @modelcontextprotocol/publisher login github-oidc
          npx @modelcontextprotocol/publisher publish